[project]
name = "agent-harness"
version = "0.1.0"
description = "HTTP/SSE service and Python SDK primitives for CLI coding agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.0",
    "uvicorn[standard]>=0.38.0",
    "watchfiles>=1.1.1",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
