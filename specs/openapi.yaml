openapi: 3.1.0
info:
  title: agent-harness API
  version: 0.1.0-beta
  summary: HTTP and SSE API for CLI-agent sessions and runs.
  description: |
    v1 is a local/trusted single-user API. Identity and auth are deliberately
    outside the wire contract. The primary nouns are Session, the persistent
    conversation, and Run, one addressable invocation inside a session.
servers:
  - url: http://localhost:8000
tags:
  - name: Sessions
  - name: Runs
  - name: Events
  - name: Backends
paths:
  /v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create a harness-origin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List the caller's sessions.
      description: In v1 this returns all known sessions for the single local caller.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"

  /v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get a session.
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Sessions]
      operationId: archiveSession
      summary: Archive a session.
      description: Soft-archives the session. It does not stop external CLI processes.
      responses:
        "200":
          description: Archived session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Sessions]
      operationId: patchSession
      summary: Patch user-mutable session fields.
      description: |
        Updates the listed user-mutable fields and bumps `updated_at`.
        Absent fields are left untouched (set-if-present semantics via
        `model_dump(exclude_unset=True)`). Explicit `null` clears the effort override;
        null title is rejected with 422. Empty
        payload `{}` is a 200 noop that returns the session unchanged.
        Publishes a `session.updated` event listing the changed fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSessionRequest"
      responses:
        "200":
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/sessions/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: listSessionMessages
      summary: List normalized session messages.
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/Error"

  /v1/sessions/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Runs]
      operationId: createRun
      summary: Start a run in a session.
      description: |
        Starts a harness-origin run and returns immediately with session_id and
        run_id. If the session is external, the harness attempts backend resume;
        unsupported resume returns 409 Conflict, whose `detail` names the reason.

        External `pi` sessions resume **headlessly** (`pi -p --session <path>`), appending to the
        transcript the terminal created. Both of pi's resume forms are create-if-missing —
        `--session-id <unknown>` warns and starts a new conversation, and `--session <missing
        path>` writes that file and starts one — so before creating the run the harness verifies
        the recorded transcript exists and that its `session` header names this session. If it
        doesn't, the request 409s rather than returning an answer with none of the thread's
        history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    get:
      tags: [Runs]
      operationId: listSessionRuns
      summary: List runs in a session.
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"

  /v1/sessions/{id}/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a run.
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Runs]
      operationId: interruptRun
      summary: Interrupt a run.
      description: |
        Interrupts a harness-origin run when the harness owns the process.
        External-origin runs return 409 Conflict in v1.
      responses:
        "200":
          description: Interrupted run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterruptRunResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/sessions/{id}/forks:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: forkSession
      summary: Fork a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkSessionRequest"
      responses:
        "201":
          description: Forked session, with optional first run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForkSessionResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/sessions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/EventFrom"
    get:
      tags: [Events, Sessions]
      operationId: streamSessionEvents
      summary: Stream events for a whole session.
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "404":
          $ref: "#/components/responses/Error"

  /v1/events:
    get:
      tags: [Events]
      operationId: streamFirehoseEvents
      summary: Stream events for all sessions and runs.
      parameters:
        - $ref: "#/components/parameters/EventFrom"
      responses:
        "200":
          $ref: "#/components/responses/EventStream"

  /v1/backends:
    get:
      tags: [Backends]
      operationId: listBackends
      summary: List supported backends.
      responses:
        "200":
          description: Backend descriptors.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Backend"

  /v1/backends/{name}/models:
    parameters:
      - $ref: "#/components/parameters/BackendName"
    get:
      tags: [Backends]
      operationId: listBackendModels
      summary: List models for a backend.
      responses:
        "200":
          description: Model names.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: string
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Harness id, or stable external id such as claude_<uuid> or codex_<uuid>.
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    BackendName:
      name: name
      in: path
      required: true
      schema:
        type: string
    EventFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        enum: [now, beginning]
        default: now
      description: Unknown query parameters must be ignored for wrapper compatibility.

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EventStream:
      description: Server-Sent Events encoded as text/event-stream.
      content:
        text/event-stream:
          schema:
            type: string
          examples:
            runStarted:
              value: |
                id: 42
                event: run.started
                data: {"sequence":42,"run_id":"run_abc123","session_id":"ses_abc123"}

  schemas:
    Session:
      type: object
      required: [id, backend, project, title, created_at, updated_at, status, origin, stats]
      properties:
        id:
          type: string
        backend:
          type: string
        model:
          type: [string, "null"]
          description: |
            Null means "use the backend CLI's own configured default" — the command builder omits
            `--model`. pi callers rely on this.
        effort:
          type: [string, "null"]
          minLength: 1
          description: |
            Reasoning/thinking level applied to every run in this session. Null means "emit no
            flag", leaving defaults and any saved resume settings to the backend CLI. Like
            `model`, this is a non-empty free-form string: the harness does not validate supported
            levels. Values depend on the CLI version and selected model; they are not universal.
            Flags: `claude --effort`, `codex -c model_reasoning_effort=`, `pi --thinking`.
            PATCH changes commands built after the update without recreating the session;
            running and already-queued commands retain their original effort. Forks inherit
            the parent's effort. Null clears the override but does not erase CLI session settings.
        project:
          $ref: "#/components/schemas/Project"
        title:
          type: [string, "null"]
        title_source:
          type: [string, "null"]
          enum: [native, null]
          description: |
            Provenance of `title`. `native`: copied by the observer from the backend's own
            conversation name (pi `session_info.name`, claude `custom-title`) on an
            `origin: external` session, and updated when that name changes. Null: explicit
            (set via create, PATCH or fork) or no title. A native name never replaces an
            explicit title; PATCHing `title` makes it explicit. Blank native names are
            ignored rather than clearing the title. Renames do not change `status` or
            `updated_at`.
        bypass_permissions:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [idle, running, waiting_for_input, archived]
        origin:
          $ref: "#/components/schemas/Origin"
        stats:
          $ref: "#/components/schemas/SessionStats"
        codex_resume_id:
          type: [string, "null"]
          description: |
            Codex rollout UUID. Used by CodexCommandBuilder to pick `codex exec resume <uuid>` over
            a fresh `codex exec`. Set once by the observer when binding extracts the UUID from the
            rollout filename (harness origin), or by the startup backfill from `codex_<uuid>` ids
            (external origin). Null on non-codex sessions and on codex sessions whose first run
            hasn't yet completed binding.
        pi_transcript_path:
          type: [string, "null"]
          description: |
            pi only: absolute path of the transcript this session was observed in, recorded by
            the observer. pi resumes a conversation by FILE (`pi -p --session <path>`), and the
            path cannot be reconstructed from the session id: the directory name mangles `/` to
            `-` (lossy), the root moves with `PI_CODING_AGENT_DIR` / `--observe-root`, and the
            filename carries a creation timestamp the id does not encode. Null for non-pi
            sessions and for harness-origin pi sessions, which address their own conversation by
            `--session-id` instead.
        forked_from:
          type: [string, "null"]
          description: |
            Parent session id this session was forked from (POST /v1/sessions/{id}/forks). Null for
            non-fork sessions. Set once at fork creation; the command builder consumes it on the
            first run to resume the parent's conversation into this child's own transcript.

    Run:
      type: object
      required: [id, session_id, status, started_at, completed_at, input_message_id, stop_reason, origin, usage]
      properties:
        id:
          type: string
        session_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, interrupted]
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        input_message_id:
          type: [string, "null"]
        stop_reason:
          type: [string, "null"]
          enum: [end_turn, tool_use, max_tokens, interrupted, null]
        origin:
          $ref: "#/components/schemas/Origin"
        usage:
          $ref: "#/components/schemas/Usage"

    Message:
      type: object
      required: [id, role, timestamp, blocks, run_id]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        timestamp:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/MessageBlock"
        model:
          type: [string, "null"]
        run_id:
          type: [string, "null"]

    MessageBlock:
      oneOf:
        - $ref: "#/components/schemas/TextBlock"
        - $ref: "#/components/schemas/ThinkingBlock"
        - $ref: "#/components/schemas/ToolUseBlock"
        - $ref: "#/components/schemas/ToolResultBlock"
        - $ref: "#/components/schemas/ImageBlock"
      discriminator:
        propertyName: type

    TextBlock:
      type: object
      required: [type, text]
      properties:
        type:
          const: text
        text:
          type: string
    ThinkingBlock:
      type: object
      required: [type, text]
      properties:
        type:
          const: thinking
        text:
          type: string
    ToolUseBlock:
      type: object
      required: [type, name, input, id]
      properties:
        type:
          const: tool_use
        name:
          type: string
        input:
          type: object
          additionalProperties: true
        id:
          type: string
    ToolResultBlock:
      type: object
      required: [type, tool_use_id, content, is_error]
      properties:
        type:
          const: tool_result
        tool_use_id:
          type: string
        content:
          type: string
        is_error:
          type: boolean
    ImageBlock:
      type: object
      required: [type, media_type, data]
      properties:
        type:
          const: image
        media_type:
          type: string
        data:
          type: string

    Backend:
      type: object
      required: [name, display_name, available, capabilities]
      properties:
        name:
          type: string
        display_name:
          type: string
        available:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/BackendCapabilities"

    BackendCapabilities:
      type: object
      required:
        - fork
        - subagents
        - permission_detection
        - interactive_pty
        - stream_json
        - structured_output
        - session_id_choice
        - max_budget
        - mcp
        - effort
        - sandbox
        - tools
      properties:
        fork:
          type: boolean
        subagents:
          type: boolean
        permission_detection:
          type: boolean
        interactive_pty:
          type: boolean
        stream_json:
          type: boolean
        structured_output:
          type: boolean
        session_id_choice:
          type: boolean
        max_budget:
          type: boolean
        mcp:
          type: boolean
        effort:
          type: boolean
        sandbox:
          oneOf:
            - type: "null"
            - type: array
              items:
                type: string
                enum: [read-only, workspace-write, danger]
        tools:
          type: string
          enum: [granular, name-list, none]
        interrupt_external_runs:
          type: boolean
          default: false

    Event:
      type: object
      required: [sequence, event, data]
      properties:
        sequence:
          type: integer
          minimum: 1
        event:
          type: string
          enum:
            - run.started
            - message.delta
            - message
            - tool.call
            - tool.result
            - permission.denied
            - run.completed
            - run.failed
            - run.interrupted
            - run.usage
            - run.end_turn
            - run.terminated_after_end_turn
            - run.timed_out_idle
            - run.warning
            - process.stderr
            - session.updated
            - ping
        data:
          type: object
          additionalProperties: true

    CreateSessionRequest:
      type: object
      required: [backend, project]
      properties:
        backend:
          type: string
        model:
          type: [string, "null"]
          description: Optional; omit to use the backend CLI's own configured default.
        effort:
          type: [string, "null"]
          minLength: 1
          description: |
            Optional reasoning/thinking level; omit to use the backend CLI's own configured
            default. Non-empty free-form string, like `model`; supported values depend on the
            backend CLI version and model. Null emits no override.
        project:
          $ref: "#/components/schemas/Project"
        title:
          type: [string, "null"]
        bypass_permissions:
          type: boolean
          default: false

    PatchSessionRequest:
      type: object
      description: |
        Patch payload for `PATCH /v1/sessions/{id}`. Only user-mutable
        fields are listed; everything else on Session is derived
        (status, stats, updated_at) or immutable (id, backend, origin,
        created_at). Omit a field to leave it unchanged. Null effort clears the override;
        null title is rejected with 422.
      properties:
        title:
          type: string
          minLength: 1
        effort:
          type: [string, "null"]
          minLength: 1
          description: |
            New reasoning/thinking level for commands built after this update, in the same
            conversation. Running and already-queued commands are unchanged. Null clears the
            override so no effort flag is emitted; backend resume settings may still apply.

    CreateRunRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        model:
          type: [string, "null"]

    CreateRunResponse:
      type: object
      required: [session_id, run_id, status]
      properties:
        session_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, interrupted]

    InterruptRunResponse:
      type: object
      required: [run, dropped_queued]
      properties:
        run:
          $ref: "#/components/schemas/Run"
        dropped_queued:
          type: array
          items:
            $ref: "#/components/schemas/Run"

    ForkSessionRequest:
      type: object
      properties:
        title:
          type: [string, "null"]
        message:
          type: [string, "null"]
          description: Optional first user message to start a run in the fork.

    ForkSessionResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        run:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"

    Project:
      type: object
      required: [path, name]
      properties:
        path:
          type: string
        name:
          type: string

    SessionStats:
      type: object
      required: [messages, tokens, cost_usd]
      properties:
        messages:
          type: integer
          minimum: 0
        tokens:
          type: object
          description: Sum of input, output, cache_read, and cache_creation token usage across runs in the session.
          additionalProperties: true
        cost_usd:
          type: number
          minimum: 0
        context_window:
          type: [integer, "null"]
          minimum: 1
          description: Latest model context-window size observed for the session (codex token_count event_msg). Null until first observed; claude sessions never set it.
        context_used:
          type: [integer, "null"]
          minimum: 0
          description: |
            Per-session SNAPSHOT of currently-loaded context tokens (overwrite-not-sum), distinct from
            cumulative `tokens`. Sourced from codex `info.total_token_usage.total_tokens` and claude
            `message.usage.input + cache_creation + cache_read` (output excluded). Null until first observation;
            decreases (after context compaction) are valid.

    Usage:
      type: object
      required: [input, output, cache_read, cache_creation, cost_usd]
      properties:
        input:
          type: integer
          minimum: 0
        output:
          type: integer
          minimum: 0
        cache_read:
          type: integer
          minimum: 0
        cache_creation:
          type: integer
          minimum: 0
        cost_usd:
          type: number
          minimum: 0

    Origin:
      type: string
      enum: [harness, external]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
